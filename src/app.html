<title>Atelier M3U</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout : régie de diffusion — barre de commande, rail des groupes, grille des chaînes virtualisée, inspecteur du flux. */
:root{
  --bg:#0e1318; --panel:#151c24; --raise:#1c2530; --line:#283341; --line2:#344253;
  --fg:#e5ecf3; --mute:#8696a8; --faint:#5d6c7d;
  --accent:#f3a324; --accent-ink:#1b1204; --accent-soft:rgba(243,163,36,.14);
  --live:#ff5a52; --ok:#3ccf8f; --info:#5aa9ff;
  --sel:rgba(243,163,36,.11); --shadow:0 18px 50px rgba(0,0,0,.45);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:7px; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef1f5; --panel:#ffffff; --raise:#f4f6f9; --line:#d7dee7; --line2:#c3cdd9;
  --fg:#111821; --mute:#566476; --faint:#8592a2;
  --accent:#b66a00; --accent-ink:#ffffff; --accent-soft:rgba(182,106,0,.12);
  --live:#d32f2f; --ok:#12865a; --info:#1f6fd1;
  --sel:rgba(182,106,0,.09); --shadow:0 18px 50px rgba(20,30,45,.18); color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#eef1f5; --panel:#ffffff; --raise:#f4f6f9; --line:#d7dee7; --line2:#c3cdd9;
  --fg:#111821; --mute:#566476; --faint:#8592a2;
  --accent:#b66a00; --accent-ink:#ffffff; --accent-soft:rgba(182,106,0,.12);
  --live:#d32f2f; --ok:#12865a; --info:#1f6fd1;
  --sel:rgba(182,106,0,.09); --shadow:0 18px 50px rgba(20,30,45,.18); color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}

/* Barre du haut */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:6px}
.mark{display:grid;grid-template-columns:repeat(7,4px);height:22px;border-radius:3px;overflow:hidden}
.mark i{display:block}
.brand h1{font:700 22px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;margin:0;white-space:nowrap}
.brand h1 span{color:var(--accent)}
.pname{min-width:0;flex:0 1 220px;background:transparent;border:1px solid transparent;border-radius:var(--r);padding:6px 8px;font-weight:500}
.pname:hover,.pname:focus{border-color:var(--line2);background:var(--panel)}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line2);background:var(--panel);cursor:pointer;white-space:nowrap;font-weight:500}
.btn:hover{border-color:var(--mute)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--raise)}
.btn.danger{color:var(--live)}
.btn.sm{height:28px;padding:0 9px;font-size:13px}
.btn.icon{width:34px;padding:0;justify-content:center}
.btn svg,.ib svg{width:16px;height:16px;flex:none}
.ib{width:28px;height:28px;display:inline-grid;place-items:center;border:0;background:transparent;border-radius:6px;cursor:pointer;color:var(--mute)}
.ib:hover{background:var(--raise);color:var(--fg)}
.kbd{font:11px var(--f-mono);color:var(--faint)}
.wrapm{position:relative}
.menu{position:absolute;top:calc(100% + 6px);right:0;z-index:40;min-width:250px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:grid}
.menu button{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:6px;cursor:pointer}
.menu button:hover{background:var(--raise)}
.menu button small{margin-left:auto;color:var(--faint);font-size:12px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}

/* Zone principale */
.main{min-height:0;display:grid;grid-template-columns:250px minmax(0,1fr) 350px;gap:10px}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.ph{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.ph h2{font:600 15px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;margin:0;color:var(--mute)}
.ph .spacer{flex:1}

/* Groupes */
.groups{overflow:auto;padding:6px;display:grid;gap:1px;align-content:start}
.g{display:grid;grid-template-columns:14px minmax(0,1fr) auto 26px;align-items:center;gap:6px;padding:6px 6px 6px 4px;border-radius:6px;cursor:pointer;user-select:none}
.g:hover{background:var(--raise)}
.g.on{background:var(--accent-soft)}
.g.on .gn{color:var(--fg);font-weight:600}
.g.off .gn,.g.off .gc{opacity:.45;text-decoration:line-through}
.g.drop{box-shadow:inset 0 0 0 2px var(--accent)}
.g.dropb{box-shadow:inset 0 2px 0 var(--accent)}
.grip{color:var(--faint);cursor:grab;font-size:11px;letter-spacing:-2px;text-align:center}
.gn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gc{font:12px var(--f-mono);color:var(--faint);font-variant-numeric:tabular-nums}
.g .ib{width:24px;height:24px;opacity:.0}
.g:hover .ib,.g.off .ib{opacity:1}
.g.all{grid-template-columns:14px minmax(0,1fr) auto;font-weight:500}
.gsep{font:600 11px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:10px 8px 4px}

/* Liste */
.lbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px;border-bottom:1px solid var(--line)}
.search{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:0;border:1px solid var(--line2);border-radius:var(--r);background:var(--bg);height:34px}
.search svg{width:16px;height:16px;margin:0 6px 0 10px;color:var(--faint);flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;height:100%}
.search.bad{border-color:var(--live)}
.search select{border:0;border-left:1px solid var(--line);background:transparent;height:100%;padding:0 6px;color:var(--mute);max-width:110px}
.tog{height:100%;border:0;border-left:1px solid var(--line);background:transparent;padding:0 10px;font:12px var(--f-mono);color:var(--faint);cursor:pointer;border-radius:0 var(--r) var(--r) 0}
.tog.on{color:var(--accent);background:var(--accent-soft)}
.sel{height:34px;border:1px solid var(--line2);border-radius:var(--r);background:var(--panel);padding:0 8px;max-width:170px}
.listwrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;container-type:inline-size}
.lhead,.row{display:grid;grid-template-columns:30px 46px 38px minmax(0,1.4fr) minmax(0,.8fr) minmax(0,1.1fr) 64px;align-items:center;gap:8px;padding:0 10px}
.lhead{height:34px;border-bottom:1px solid var(--line);font:600 12px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.list{flex:1;min-height:0;overflow:auto;position:relative}
.spc{position:relative}
.rows{position:absolute;left:0;right:0;top:0}
.row{height:48px;border-bottom:1px solid var(--line);cursor:default;position:relative}
.row:hover{background:var(--raise)}
.row.s{background:var(--sel)}
.row.cur{box-shadow:inset 3px 0 0 var(--accent)}
.row.x{opacity:.45}
.row.db::before,.row.da::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--accent);z-index:2}
.row.db::before{top:-1px}.row.da::after{bottom:-1px}
.row input[type=checkbox],.lhead input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);margin:0}
.num{font:12px var(--f-mono);color:var(--faint);font-variant-numeric:tabular-nums;text-align:right}
.logo{width:34px;height:34px;border-radius:6px;background:var(--raise);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;position:relative;flex:none}
.logo b{font:700 12px var(--f-display);letter-spacing:.04em;color:var(--mute)}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--raise)}
.nm{min-width:0;display:grid;gap:1px}
.nm .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.nm .u{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:11.5px var(--f-mono);color:var(--faint)}
.cg{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute);font-size:13px}
.cu{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:12px var(--f-mono);color:var(--mute)}
.ra{display:flex;justify-content:flex-end;gap:2px}
.pill{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;font:600 10.5px var(--f-mono);letter-spacing:.03em;margin-right:6px;vertical-align:1px;border:1px solid currentColor}
.p-live{color:var(--live)}.p-film{color:var(--info)}.p-serie{color:var(--ok)}.p-radio{color:var(--accent)}
@container (max-width:760px){.lhead,.row{grid-template-columns:30px 40px 38px minmax(0,1fr) 64px}.c-grp,.c-url{display:none}}
@container (max-width:420px){.lhead,.row{grid-template-columns:28px 38px minmax(0,1fr) 34px}.c-num{display:none}.ra .ib:not(.play){display:none}}
.empty{position:absolute;inset:34px 0 0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--mute)}
.empty h3{font:600 22px var(--f-display);letter-spacing:.03em;color:var(--fg);margin:0 0 6px}
.empty p{margin:0 0 14px;max-width:46ch}
.dropzone-on .listwrap::after{content:"Déposez vos fichiers M3U ici";position:absolute;inset:8px;border:2px dashed var(--accent);border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);font:600 20px var(--f-display);letter-spacing:.05em;color:var(--fg);z-index:20}

/* Onglets de type et vue affiches */
.ttabs{display:flex;align-items:center;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.ttabs::-webkit-scrollbar{display:none}
.ttabs button{border:0;background:transparent;padding:9px 10px 8px;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap;font:600 14px var(--f-display);letter-spacing:.06em;text-transform:uppercase;display:flex;gap:6px;align-items:baseline}
.ttabs button small{font:11px var(--f-mono);color:var(--faint);letter-spacing:0}
.ttabs button.on{color:var(--fg);border-color:var(--accent)}
.ttabs .vm{margin-left:auto;display:flex;gap:2px;padding-left:8px}
.ttabs .vm button{padding:6px;border:0;border-radius:6px;color:var(--faint)}
.ttabs .vm button.on{color:var(--accent);background:var(--accent-soft)}
.ttabs .vm svg{width:16px;height:16px;display:block}
.listwrap.grid .lhead{display:none}
.rows.grid{display:grid;gap:12px;padding:12px}
.card{display:grid;grid-template-rows:auto auto;gap:6px;cursor:pointer;min-width:0;border-radius:8px;padding:6px;position:relative}
.card:hover{background:var(--raise)}
.card.s{background:var(--sel);box-shadow:inset 0 0 0 1px var(--accent)}
.card.cur{box-shadow:inset 0 0 0 2px var(--accent)}
.card.x{opacity:.45}
.poster{aspect-ratio:2/3;max-width:100%;border-radius:6px;background:var(--raise);border:1px solid var(--line);position:relative;overflow:hidden;display:grid;place-items:center}
.poster b{font:700 30px var(--f-display);color:var(--faint);letter-spacing:.04em}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster .pill{position:absolute;left:6px;top:6px;background:var(--panel);margin:0}
.poster .rt{position:absolute;right:6px;top:6px;background:var(--accent);color:var(--accent-ink);font:600 11px var(--f-mono);padding:1px 5px;border-radius:4px}
.poster input{position:absolute;right:6px;bottom:6px;width:18px;height:18px;accent-color:var(--accent);margin:0}
.card .ct{font-weight:500;font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.card .cs{font:11.5px var(--f-mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Inspecteur */
.insp{overflow:auto;padding:14px;display:grid;gap:14px;align-content:start}
.ihead{display:flex;gap:12px;align-items:center}
.ihead .logo{width:56px;height:56px;border-radius:9px}
.ihead .logo b{font-size:18px}
.ihead h3{font:600 20px/1.15 var(--f-display);letter-spacing:.02em;margin:0;word-break:break-word;text-wrap:balance}
.ihead .meta{font:12px var(--f-mono);color:var(--faint)}
.fs{display:grid;gap:10px}
.fs>h4{font:600 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:4px 0 0;display:flex;align-items:center;gap:8px}
.fs>h4::after{content:"";flex:1;border-top:1px solid var(--line)}
.fld{display:grid;gap:4px;min-width:0}
.fld label{font-size:12px;color:var(--mute);display:flex;justify-content:space-between;gap:8px}
.fld label code{font:11px var(--f-mono);color:var(--faint)}
.fld label.chk{justify-content:flex-start;font-size:14px;color:var(--fg)}
.three .fld label{flex-direction:column;gap:0}
#ipanel,#xtp,#rgp{display:grid;gap:14px;align-content:start}
.in,.ta{width:100%;min-width:0;border:1px solid var(--line2);border-radius:6px;background:var(--bg);padding:7px 9px;outline:0}
.in:focus,.ta:focus{border-color:var(--accent)}
.in.mono,.ta{font:12.5px var(--f-mono)}
.ta{resize:vertical;min-height:64px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.inrow{display:flex;gap:6px}
.inrow .in{flex:1}
.kv{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr) 28px;gap:6px;align-items:center}
.raw{font:11.5px/1.5 var(--f-mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;white-space:pre-wrap;word-break:break-all;color:var(--mute);max-height:180px;overflow:auto}
.raw .k{color:var(--accent)}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.ihint{color:var(--mute);font-size:13px;display:grid;gap:10px}
.ihint ul{margin:0;padding-left:18px;display:grid;gap:4px}
.kb{font:11px var(--f-mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--fg);background:var(--raise)}
.big{font:700 34px/1 var(--f-display);letter-spacing:.02em}

/* Barre d'état */
.status{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font:12px var(--f-mono);color:var(--faint);font-variant-numeric:tabular-nums}
.status b{color:var(--fg);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font:600 11px var(--f-body)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}

/* Fenêtres */
.ov{position:fixed;inset:0;z-index:60;background:rgba(5,8,12,.55);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:min(640px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.sheet.wide{width:min(900px,100%)}
.sh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sh h3{font:600 20px/1 var(--f-display);letter-spacing:.03em;margin:0;flex:1}
.sb{padding:16px;overflow:auto;display:grid;gap:14px;min-height:0}
.sf{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);background:var(--raise)}
.note{font-size:13px;color:var(--mute)}
.note.warn{color:var(--accent)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 0}
.tabs button{border:0;background:transparent;padding:8px 12px;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent;font-weight:500}
.tabs button.on{color:var(--fg);border-color:var(--accent)}
.drop{border:2px dashed var(--line2);border-radius:10px;padding:26px;text-align:center;color:var(--mute);cursor:pointer;display:grid;gap:6px}
.drop:hover,.drop.on{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{color:var(--fg);font:600 18px var(--f-display);letter-spacing:.03em}
.opts{display:grid;gap:8px}
.chk{display:flex;gap:9px;align-items:flex-start;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px;margin:2px 0 0}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;flex-wrap:wrap}
.seg label{display:flex;align-items:center;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{padding:6px 11px;font-size:13px;color:var(--mute);border-right:1px solid var(--line)}
.seg label:last-child span{border-right:0}
.seg input:checked+span{background:var(--accent-soft);color:var(--fg);font-weight:600}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.pre{font:12px/1.5 var(--f-mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:260px;overflow:auto;white-space:pre;color:var(--mute)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font:600 11.5px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.tbl td.n{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.tbl .mono{font:12px var(--f-mono);word-break:break-all}
.scroll{overflow:auto;max-height:300px;border:1px solid var(--line);border-radius:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--raise)}
.stat small{display:block;color:var(--mute);font-size:12px}
.stat b{font:700 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 2fr 56px;gap:10px;align-items:center;font-size:13px}
.bar i{display:block;height:8px;border-radius:4px;background:var(--accent)}
.bar span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar span:last-child{font:12px var(--f-mono);text-align:right;color:var(--mute)}
video{width:100%;max-height:52vh;background:#000;border-radius:8px}
.toasts{position:fixed;z-index:80;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:grid;gap:8px;justify-items:end;pointer-events:none}
.toast{background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;box-shadow:var(--shadow);font-size:13px;max-width:min(420px,calc(100vw - 32px));animation:tin .18s ease-out}
.toast.err{background:var(--live);color:#fff}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

.only-n{display:none}
@media (max-width:1180px){
  .main{grid-template-columns:240px minmax(0,1fr)}

<script>
"use strict";
/* ============ Utilitaires ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const coll=new Intl.Collator('fr',{numeric:true,sensitivity:'base'});
const fmt=n=>n.toLocaleString('fr-FR');
const rxEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
let UID=1;
const pad2=n=>String(n).padStart(2,'0');
const ICON={
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeoff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7a9.6 9.6 0 0 0 5.4-1.6"/></svg>',
  dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>',
};

/* ============ État ============ */
const S={name:'Ma playlist',header:{},chans:[],order:[],hidden:new Set(),keep:new Set(),
  sel:new Set(),cur:null,anchor:null,view:[],pos:new Map(),counts:new Map(),
  f:{g:'*',q:'',rx:false,field:'all',type:'all',state:'all'},sample:false,editing:false,vm:'list',vmAuto:true,tcounts:{},gtypes:new Map()};
const grp=c=>c.attrs['group-title']||'';
const setGrp=(c,g)=>{if(g)c.attrs['group-title']=g;else delete c.attrs['group-title']};
const byId=id=>S.chans.find(c=>c.id===id);
function ctype(c){
  const u=(c.url||'').toLowerCase();
  if(/\/series\//.test(u))return 'serie';
  if(/\bS\d{1,2}\s?E\d{1,3}\b/i.test(c.name||''))return 'serie';
  if(/\/movie\//.test(u)||/\.(mp4|mkv|avi|mov|wmv|flv)(\?|$)/.test(u))return 'film';
  if(/\.(mp3|aac|ogg|opus|flac|m4a)(\?|$)/.test(u)||/radio/i.test(grp(c)))return 'radio';
  return 'live';
}
const TYPELABEL={live:'DIRECT',film:'FILM',serie:'SÉRIE',radio:'RADIO'};
const initials=n=>{const w=String(n||'?').replace(/^[A-Z]{2,3}\s*[:|]\s*/,'').replace(/[^\p{L}\p{N} ]/gu,' ').trim().split(/\s+/);return((w[0]||'?')[0]+(w[1]?w[1][0]:(w[0]||'')[1]||'')).toUpperCase()};

/* ============ Analyse M3U ============ */
function normKey(k){return /^(tvg-|group-|catchup|timeshift|tvg_)/i.test(k)?k.toLowerCase():k}
function parseAttrs(s){
  const o={};const re=/([A-Za-z0-9_:.\-]+)\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s"',]+))/g;let m;
  while((m=re.exec(s)))o[normKey(m[1])]=m[2]??m[3]??m[4]??'';
  return o;
}
function blank(){return{id:UID++,name:'',url:'',dur:'-1',attrs:{},extra:[],off:false}}
function parseExtinf(l){
  const s=l.replace(/^#EXTINF:/i,'');let inQ=false,cut=-1;
  for(let i=0;i<s.length;i++){const ch=s[i];if(ch==='"')inQ=!inQ;else if(ch===','&&!inQ){cut=i;break}}
  const meta=cut<0?s:s.slice(0,cut),name=cut<0?'':s.slice(cut+1).trim();
  const dm=meta.match(/^\s*(-?\d+(?:\.\d+)?)/);
  const c=blank();c.dur=dm?dm[1]:'-1';c.attrs=parseAttrs(dm?meta.slice(dm[0].length):meta);c.name=name||c.attrs['tvg-name']||'';
  return c;
}
function nameFromUrl(u){try{const p=new URL(u);return decodeURIComponent(p.pathname.split('/').pop()||p.hostname)}catch{return u.slice(0,60)}}
function parseM3U(text){
  text=String(text).replace(/^\uFEFF/,'');
  const t=text.trim();
  if(t.startsWith('[')||t.startsWith('{')){try{return fromJSON(JSON.parse(t))}catch{}}
  const lines=text.split(/\r?\n/);const out={header:{},chans:[]};let cur=null,pre=[],extgrp=null;
  for(const raw of lines){
    const l=raw.trim();if(!l)continue;
    if(/^#EXTM3U/i.test(l)){Object.assign(out.header,parseAttrs(l.slice(7)));continue}
    if(/^#EXTINF:/i.test(l)){cur=parseExtinf(l);cur.extra=pre;pre=[];continue}
    if(/^#EXTGRP:/i.test(l)){extgrp=l.slice(8).trim();continue}
    if(l.startsWith('#')){(cur?cur.extra:pre).push(l);continue}
    const c=cur||Object.assign(blank(),{extra:pre});if(!cur)pre=[];
    c.url=l;if(!c.name)c.name=nameFromUrl(l);
    if(extgrp&&!c.attrs['group-title'])c.attrs['group-title']=extgrp;
    out.chans.push(c);cur=null;extgrp=null;
  }
  return out;
}
function fromJSON(j){
  const arr=Array.isArray(j)?j:(j.channels||[]);const out={header:j.header||{},chans:[]};
  for(const o of arr){const c=blank();c.name=o.name||'';c.url=o.url||'';c.dur=String(o.duration??'-1');c.off=!!o.disabled;
    c.attrs=Object.assign({},o.attributes||{});if(o.group)c.attrs['group-title']=o.group;c.extra=Array.isArray(o.extra)?o.extra:[];out.chans.push(c)}
  return out;
}

/* ============ Génération ============ */
const RANK=['tvg-id','tvg-name','tvg-logo','tvg-chno','tvg-shift','group-title','catchup','catchup-days','catchup-source','timeshift'];
const ESSENTIAL=new Set(['tvg-id','tvg-name','tvg-logo','tvg-chno','group-title']);
function attrStr(a,mode){
  let ks=Object.keys(a).filter(k=>a[k]!==''&&a[k]!=null);
  if(mode==='essential')ks=ks.filter(k=>ESSENTIAL.has(k));
  if(mode==='none')ks=ks.filter(k=>k==='group-title');
  ks.sort((x,y)=>{const i=RANK.indexOf(x),j=RANK.indexOf(y);return(i<0?99:i)-(j<0?99:j)});
  return ks.map(k=>`${k}="${String(a[k]).replace(/"/g,"'")}"`).join(' ');
}
function entryText(c,o={}){
  let s='#EXTINF:'+(c.dur||'-1');const as=attrStr(c.attrs,o.attrs||'all');if(as)s+=' '+as;s+=','+(c.name||'')+'\n';
  if(o.extgrp&&grp(c))s+='#EXTGRP:'+grp(c)+'\n';
  if(o.extra!==false)for(const x of c.extra)s+=x+'\n';
  return s+(c.url||'')+'\n';
}
function exportList(o){return S.chans.filter(c=>o.all||(!c.off&&!S.hidden.has(grp(c))))}
function toM3U(list,o){
  let h='#EXTM3U';const ha=attrStr(S.header,'all');if(o.header!==false&&ha)h+=' '+ha;
  return h+'\n'+list.map(c=>entryText(c,o)).join('');
}
function toJSON(list){return JSON.stringify({name:S.name,header:S.header,channels:list.map(c=>({name:c.name,group:grp(c),url:c.url,duration:c.dur,disabled:c.off||undefined,attributes:Object.fromEntries(Object.entries(c.attrs).filter(([k])=>k!=='group-title')),extra:c.extra.length?c.extra:undefined}))},null,2)}
function toCSV(list){
  const q=v=>{v=String(v??'');return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const head=['nom','groupe','url','tvg-id','tvg-name','tvg-logo','tvg-chno','active'];
  return '\uFEFF'+head.join(';')+'\n'+list.map(c=>[c.name,grp(c),c.url,c.attrs['tvg-id'],c.attrs['tvg-name'],c.attrs['tvg-logo'],c.attrs['tvg-chno'],c.off?'non':'oui'].map(q).join(';')).join('\n');
}

/* ============ ZIP (sans compression) ============ */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function makeZip(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  for(const f of files){
    const name=enc.encode(f.name),data=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,0,true);h.setUint16(12,0x21,true);
    h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),name,data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,0x21,true);
    c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer),name);off+=30+name.length+data.length;
  }
  const cs=central.reduce((s,p)=>s+p.length,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type:'application/zip'});
}
const safeName=s=>(String(s||'playlist').replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim()||'playlist').slice(0,80);
const inClaude=()=>!!(window.claude&&typeof window.claude.use==='function');
async function saveFile(filename,data){
  if(!inClaude()){
    const blob=data instanceof Blob?data:new Blob([data],{type:'text/plain;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.append(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast('Fichier enregistré : '+filename);return;
  }
  let dl=null;try{dl=await window.claude.use('downloads')}catch{}
  if(!dl){toast('L’enregistrement de fichiers n’est pas disponible dans cette vue. Utilisez « Copier ».','err');return}
  if(/\.m3u8?$/i.test(filename)){data=makeZip([{name:filename,data}]);filename=filename.replace(/\.m3u8?$/i,'')+'.zip'}
  try{await dl.save({filename,data});toast('Fichier proposé : '+filename)}
  catch(e){const c=e&&e.code;
    if(c==='declined')toast('Enregistrement annulé');
    else if(c==='rate_limited')toast('Une fenêtre d’enregistrement est déjà ouverte.');
    else toast('Enregistrement impossible ('+(c||'erreur')+'). Utilisez « Copier ».','err')}
}
async function copyText(t,label){
  try{await navigator.clipboard.writeText(t);toast((label||'Texte')+' copié')}
  catch{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();
    let ok=false;try{ok=document.execCommand('copy')}catch{}ta.remove();toast(ok?(label||'Texte')+' copié':'Copie refusée par le navigateur : sélectionnez le texte à la main.',ok?'':'err')}
}

/* ============ Historique ============ */
const UNDO=[],REDO=[];let undoSize=0;
const snap=()=>JSON.stringify({h:S.header,c:S.chans,o:S.order,x:[...S.hidden],k:[...S.keep]});
function restore(str){const d=JSON.parse(str);S.header=d.h;S.chans=d.c;S.order=d.o;S.hidden=new Set(d.x);S.keep=new Set(d.k||[]);
  for(const c of S.chans)if(c.id>=UID)UID=c.id+1;
  S.sel=new Set([...S.sel].filter(id=>S.chans.some(c=>c.id===id)));if(S.cur&&!byId(S.cur))S.cur=null}
function pushUndo(){const s=snap();UNDO.push(s);undoSize+=s.length;REDO.length=0;
  while(UNDO.length>80||(undoSize>60e6&&UNDO.length>1))undoSize-=UNDO.shift().length;S.sample=false;updUndo()}
function undo(){if(!UNDO.length)return;const s=UNDO.pop();undoSize-=s.length;REDO.push(snap());restore(s);refresh(true);toast('Annulé')}
function redo(){if(!REDO.length)return;UNDO.push(snap());restore(REDO.pop());refresh(true);toast('Rétabli')}
function updUndo(){$('#bUndo').disabled=!UNDO.length;$('#bRedo').disabled=!REDO.length}
function mutate(fn,msg){pushUndo();fn();refresh(true);if(msg)toast(msg)}

/* ============ Sauvegarde locale ============ */
const LS='atelier-m3u:v1';
const autosave=debounce(()=>{try{localStorage.setItem(LS,JSON.stringify({name:S.name,s:snap(),sample:S.sample}))}catch{}},700);
function loadSaved(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d&&d.s){restore(d.s);S.name=d.name||S.name;S.sample=!!d.sample;return true}}catch{}return false}

/* ============ Groupes ============ */
function syncGroups(){
  const counts=new Map();for(const c of S.chans){const g=grp(c);counts.set(g,(counts.get(g)||0)+1)}
  S.order=S.order.filter(g=>counts.has(g)||S.keep.has(g));const have=new Set(S.order);
  for(const g of counts.keys())if(!have.has(g)){S.order.push(g);have.add(g)}
  for(const g of [...S.keep])if(counts.has(g))S.keep.delete(g);
  for(const g of [...S.hidden])if(!have.has(g))S.hidden.delete(g);

function dupSets(){

  for(const c of S.chans){const ku=(c.url||'').trim();if(ku)u.set(ku,(u.get(ku)||0)+1);const kn=normName(c.name);if(kn)n.set(kn,(n.get(kn)||0)+1)}

function computeView(){
  const f=S.f;let test=null;$('#searchBox').classList.remove('bad');
  if(f.q.trim()){
    if(f.rx){try{const r=new RegExp(f.q,'i');test=s=>r.test(s)}catch{$('#searchBox').classList.add('bad')}}
    else{const words=fold(f.q).split(/\s+/).filter(Boolean);test=s=>{const h=fold(s);return words.every(w=>h.includes(w))}}
  }
  let d=null;if(f.state==='dupurl'||f.state==='dupname')d=dupSets();
  S.pos=new Map();const tc={all:0,live:0,film:0,serie:0,radio:0},gt=new Map();
  S.chans.forEach((c,i)=>{S.pos.set(c.id,i);const t=ctype(c),g=grp(c);let o=gt.get(g);if(!o){o={live:0,film:0,serie:0,radio:0};gt.set(g,o)}o[t]++;if(f.g==='*'||g===f.g){tc.all++;tc[t]++}});
  S.tcounts=tc;S.gtypes=gt;
  S.view=S.chans.filter(c=>{
    if(f.g!=='*'&&grp(c)!==f.g)return false;
    if(f.type!=='all'&&ctype(c)!==f.type)return false;
    switch(f.state){
      case 'on':if(c.off||S.hidden.has(grp(c)))return false;break;
      case 'off':if(!c.off&&!S.hidden.has(grp(c)))return false;break;
      case 'nologo':if(c.attrs['tvg-logo'])return false;break;
      case 'noid':if(c.attrs['tvg-id'])return false;break;
      case 'nogroup':if(grp(c))return false;break;
      case 'badurl':if(validUrl(c.url))return false;break;
      case 'dupurl':if((d.u.get((c.url||'').trim())||0)<2)return false;break;
      case 'dupname':if((d.n.get(normName(c.name))||0)<2)return false;break;
    }
    if(test){const k=f.field;const h=k==='all'?c.name+' '+c.url+' '+(c.attrs['tvg-id']||'')+' '+(c.attrs['tvg-name']||'')+' '+grp(c):k==='name'?c.name:k==='url'?c.url:(c.attrs[k]||'');if(!test(h))return false}
    return true;
  });
  renderTypes();
}

document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)||document.activeElement?.isContentEditable;
  const mod=e.ctrlKey||e.metaKey;
  if(e.key==='Escape'){if($('.ov')){closeModal();return}closeMenus();$('#inspane').classList.remove('open');$('#gpane').classList.remove('open');return}
  if($('.ov'))return;
  if(mod&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&e.key.toLowerCase()==='y'&&!typing){e.preventDefault();redo();return}
  if(mod&&e.key.toLowerCase()==='h'){e.preventDefault();openTool('replace');return}
  if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();openExport(false);return}
  if(mod&&e.key.toLowerCase()==='o'){e.preventDefault();openImport();return}
  if(typing)return;
  if(e.key==='/'||(mod&&e.key.toLowerCase()==='f')){e.preventDefault();$('#q').focus();$('#q').select();return}
  if(mod&&e.key.toLowerCase()==='a'){e.preventDefault();S.view.forEach(c=>S.sel.add(c.id));renderList();renderInsp();renderStatus();return}
  if(mod&&e.key.toLowerCase()==='d'&&S.sel.size){e.preventDefault();dupIds([...S.sel]);return}
  if((e.key==='Delete'||e.key==='Backspace')&&S.sel.size){e.preventDefault();delIds([...S.sel]);return}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(!S.view.length)return;e.preventDefault();let i=S.view.findIndex(c=>c.id===S.cur);i=Math.max(0,Math.min(S.view.length-1,i+(e.key==='ArrowDown'?1:-1)));
    const id=S.view[i].id;if(e.shiftKey)S.sel.add(id);else S.sel=new Set([id]);S.cur=id;S.anchor=id;scrollToCur();renderInsp();renderStatus()}
});

function openModal(title,body,{wide,foot}={}){
  closeModal();const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="sheet${wide?' wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sh"><h3>${esc(title)}</h3><button class="ib" data-close title="Fermer">${ICON.x}</button></div><div class="sb">${body}</div>${foot?`<div class="sf">${foot}</div>`:''}</div>`;
  ov.addEventListener('mousedown',e=>{if(e.target===ov)ov._down=true});
  ov.addEventListener('click',e=>{if((e.target===ov&&ov._down)||e.target.closest('[data-close]'))closeModal();ov._down=false});
  document.body.append(ov);setTimeout(()=>{const f=ov.querySelector('.sb input:not([type=radio]):not([type=checkbox]),.sb textarea');f?.focus()},30);return ov.querySelector('.sheet');
}
function closeModal(){const ov=$('.ov');if(!ov)return;ov._onclose?.();ov.remove()}
function ask(title,{value='',ok='Valider',ph='',list}={}){
  return new Promise(res=>{const sh=openModal(title,`${list?groupDatalist():''}<input class="in" id="askv" value="${esc(value)}" placeholder="${esc(ph)}"${list?' list="dlg"':''}>`,{foot:`<button class="btn" data-close>Annuler</button><button class="btn pri" id="askok">${esc(ok)}</button>`});
    let done=false;const fin=v=>{if(done)return;done=true;res(v)};sh.parentElement._onclose=()=>fin(null);
    const go=()=>{const v=$('#askv').value.trim();fin(v);closeModal()};$('#askok').onclick=go;$('#askv').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
    setTimeout(()=>$('#askv')?.select(),40)});
}
function confirmBox(msg,ok='Confirmer'){
  return new Promise(res=>{const sh=openModal('Confirmation',`<p style="margin:0">${esc(msg)}</p><p class="note" style="margin:0">Vous pourrez revenir en arrière avec Annuler (Ctrl+Z).</p>`,{foot:`<button class="btn" data-close>Retour</button><button class="btn pri" id="cfok">${esc(ok)}</button>`});
    let done=false;sh.parentElement._onclose=()=>{if(!done){done=true;res(false)}};$('#cfok').onclick=()=>{done=true;res(true);closeModal()};$('#cfok').focus()});
}

function toast(msg,kind){const t=document.createElement('div');t.className='toast'+(kind==='err'?' err':'');t.textContent=msg;const box=$('#toasts');box.append(t);if(box.children.length>4)box.firstChild.remove();setTimeout(()=>t.remove(),kind==='err'?6000:2600)}
function scopeHTML(def){

  const r=(v,l,n)=>`<label><input type="radio" name="scope" value="${v}"${def===v?' checked':''}${n?'':' disabled'}><span>${l} (${fmt(n)})</span></label>`;

/* ============ Import ============ */
function applyImport(parsed,mode,label){
  if(!parsed.chans.length&&!Object.keys(parsed.header).length){toast('Aucune chaîne trouvée dans '+label+'. Vérifiez qu’il s’agit bien d’une playlist M3U.','err');return false}
  mutate(()=>{if(mode==='replace'){S.chans=[];S.order=[];S.hidden.clear();S.keep.clear();S.header={};S.sel.clear();S.cur=null;S.f.g='*'}
    Object.assign(S.header,parsed.header);S.chans.push(...parsed.chans)});
  S.sample=false;renderStatus();autosave();
  toast(`${fmt(parsed.chans.length)} chaînes importées depuis ${label}`);return true;
}
async function readFile(f){
  if(/\.gz$/i.test(f.name)&&'DecompressionStream' in window){return await new Response(f.stream().pipeThrough(new DecompressionStream('gzip'))).text()}
  return await f.text();
}
async function importFiles(files,mode){
  let first=true;for(const f of files){try{const txt=await readFile(f);const p=parseM3U(txt);
    if(first&&mode==='replace'&&S.name==='Ma playlist'||first&&mode==='replace'){S.name=f.name.replace(/\.(m3u8?|txt|json|gz)+$/i,'');$('#pname').value=S.name}
    applyImport(p,first?mode:'append',f.name);first=false}catch(e){toast('Lecture impossible de '+f.name+' : '+e.message,'err')}}
}
function openImport(tab='file'){
  const sh=openModal('Importer une playlist',`<div class="tabs" id="itabs"><button data-t="file">Fichier</button><button data-t="paste">Coller</button><button data-t="url">Adresse web</button><button data-t="xtream">Xtream Codes</button></div>
<div id="ipanel"></div>
<div class="fld"><label>Chaînes actuelles (${fmt(S.chans.length)})</label><div class="seg"><label><input type="radio" name="imode" value="replace" ${S.sample||!S.chans.length?'checked':''}><span>Remplacer</span></label><label><input type="radio" name="imode" value="append" ${S.sample||!S.chans.length?'':'checked'}><span>Ajouter à la suite</span></label></div></div>`,{wide:true});

/* Lecture réseau : directe, puis via le relais Cloudflare (/api/fetch) si le serveur bloque le navigateur (CORS, http sur https). */
const HAS_PROXY=!inClaude()&&/^https?:$/.test(location.protocol);
async function decodeBody(r,u){
  const ct=(r.headers.get('content-type')||'').toLowerCase();const buf=new Uint8Array(await r.arrayBuffer());
  if(buf[0]===0x1f&&buf[1]===0x8b&&'DecompressionStream' in window)return await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return new TextDecoder(/charset=([\w-]+)/.exec(ct)?.[1]||'utf-8').decode(buf);
}
async function getText(u,{signal}={}){
  let first;
  try{const r=await fetch(u,{signal});if(!r.ok)throw new Error('réponse HTTP '+r.status);return await decodeBody(r,u)}
  catch(e){if(e.name==='AbortError')throw e;first=e}
  if(!HAS_PROXY)throw first;
  const r=await fetch('/api/fetch?url='+encodeURIComponent(u),{headers:{'x-atelier':'1'},signal});
  if(!r.ok){let m='';try{m=(await r.json()).error}catch{}throw new Error(m||('relais : HTTP '+r.status))}
  return await decodeBody(r,u);
}
async function getJSON(u,o){const t=await getText(u,o);try{return JSON.parse(t)}catch{throw new Error('réponse illisible du serveur (JSON attendu)')}}
async function importUrl(u,m){
  toast('Chargement…');
  try{const txt=await getText(u);
    if(applyImport(parseM3U(txt),m,new URL(u).hostname)){closeModal();try{const n=new URL(u).pathname.split('/').pop();if(m==='replace'&&n){S.name=n.replace(/\.(m3u8?|php)$/i,'');$('#pname').value=S.name}}catch{}}}
  catch(e){toast('Chargement impossible ('+(e.message||'connexion refusée')+'). Le serveur bloque sans doute la lecture depuis un navigateur : téléchargez le fichier puis importez-le.','err')}
}

const QUALITY=/(?:^|[\s\-|_\[(])(?:UHD|FHD|HD|SD|HQ|LQ|4K|8K|2160p|1080[pi]?|720p|576p|HEVC|H\.?26[45]|x26[45]|HDR|50\s?FPS|60\s?FPS|VIP|BACKUP|RAW|MULTI)(?=$|[\s\-|_\])])/gi;
function cleanName(s,o){
  let n=String(s||'');
  if(o.symbols)n=n.replace(/[\u{1F000}-\u{1FAFF}\u2600-\u27BF\u2B00-\u2BFF★☆●◉►▶◆♦✪✦✧•▪︎■□▲▼◀▸]+/gu,' ').replace(/[ᴬ-ᵡ\u1D2C-\u1D6A\u02B0-\u02FF\u2070-\u209F]+/g,' ');
  if(o.prefix)n=n.replace(/^\s*(?:\|\s*[A-Z]{2,4}\s*\||\[\s*[A-Z]{2,4}\s*\]|\(\s*[A-Z]{2,4}\s*\)|[A-Z]{2,4}\s*[:|»]|[A-Z]{2,4}\s+-\s)\s*/,'');
  if(o.brackets)n=n.replace(/\s*[\[(][^\])]*[\])]/g,' ');
  if(o.quality){for(let i=0;i<3;i++)n=n.replace(QUALITY,' ')}
  n=n.replace(/[_]+/g,' ').replace(/\s{2,}/g,' ').replace(/^[\s\-|:.·]+|[\s\-|:.·]+$/g,'').trim();
  if(o.case==='title')n=n.toLowerCase().replace(/(^|[\s\-'’(])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
  if(o.case==='upper')n=n.toUpperCase();if(o.case==='lower')n=n.toLowerCase();
  return n||String(s||'');
}

      if(k==='group'){const seen=[];for(const c of S.chans)if(!seen.includes(grp(c)))seen.push(grp(c));S.order=seen.concat(S.order.filter(g=>!seen.includes(g)))}},'Chaînes triées');closeModal()};

const cleanObj=o=>Object.fromEntries(Object.entries(o).filter(([,v])=>v!=null&&String(v).trim()!==''&&v!=='null').map(([k,v])=>[k,String(v).trim()]));
const asArr=v=>Array.isArray(v)?v:(v&&typeof v==='object'?Object.values(v):[]);
async function xtreamApiImport(o,prog,signal){
  const h=o.host.trim().replace(/\/+$/,''),eu=encodeURIComponent(o.user.trim()),ep=encodeURIComponent(o.pass);
  if(!/^https?:\/\//i.test(h))throw new Error('l’adresse du serveur doit commencer par http:// ou https://');
  const base=`${h}/player_api.php?username=${eu}&password=${ep}`;
  prog('Connexion au serveur…');
  const auth=await getJSON(base,{signal});
  if(!auth||!auth.user_info||String(auth.user_info.auth)==='0')throw new Error('identifiants refusés par le serveur');
  if(auth.user_info.status&&!/active/i.test(auth.user_info.status))throw new Error('abonnement '+auth.user_info.status);
  const cats=async a=>new Map(asArr(await getJSON(base+'&action='+a,{signal})).map(c=>[String(c.category_id),c.category_name]));
  const out=[],pre=o.pre;
  if(o.live){prog('Chaînes en direct…');const cm=await cats('get_live_categories');
    for(const s of asArr(await getJSON(base+'&action=get_live_streams',{signal}))){const c=blank();c.name=s.name||'';c.url=`${h}/live/${eu}/${ep}/${s.stream_id}.${o.ext}`;
      Object.assign(c.attrs,cleanObj({'tvg-id':s.epg_channel_id,'tvg-name':s.name,'tvg-logo':s.stream_icon,'group-title':cm.get(String(s.category_id))||'Direct'}));
      if(+s.tv_archive===1){c.attrs.catchup='xc';if(s.tv_archive_duration)c.attrs['catchup-days']=String(s.tv_archive_duration)}out.push(c)}}
  if(o.vod){prog('Films…');const cm=await cats('get_vod_categories');
    for(const s of asArr(await getJSON(base+'&action=get_vod_streams',{signal}))){const c=blank();c.name=s.name||'';c.url=`${h}/movie/${eu}/${ep}/${s.stream_id}.${s.container_extension||'mp4'}`;
      Object.assign(c.attrs,cleanObj({'tvg-name':s.name,'tvg-logo':s.stream_icon,'group-title':(pre?'Films | ':'')+(cm.get(String(s.category_id))||'Films')}));
      c.meta=cleanObj({kind:'film',year:s.year||(s.releaseDate||s.release_date||'').slice(0,4),rating:s.rating&&+s.rating?(+s.rating).toFixed(1):''});out.push(c)}}
  if(o.series){prog('Liste des séries…');const cm=await cats('get_series_categories');const list=asArr(await getJSON(base+'&action=get_series',{signal}));
    const res=new Array(list.length);let next=0,done=0,fails=0;
    const one=async s=>{let info=null;try{info=await getJSON(base+'&action=get_series_info&series_id='+encodeURIComponent(s.series_id),{signal})}catch(e){if(e.name==='AbortError')throw e;fails++}
      done++;if(done%4===0||done===list.length)prog(`Séries : ${fmt(done)} / ${fmt(list.length)}…`);
      const r=[];if(!info)return r;const g=(pre?'Séries | ':'')+(o.sg==='show'?s.name:(cm.get(String(s.category_id))||'Séries'));
      for(const[season,eps]of Object.entries(info.episodes||{}))for(const e of asArr(eps)){const c=blank();
        const sn=String(e.season??season).padStart(2,'0'),en=String(e.episode_num??'').padStart(2,'0');
        c.name=`${s.name} S${sn} E${en}`;c.url=`${h}/series/${eu}/${ep}/${e.id}.${e.container_extension||'mp4'}`;
        Object.assign(c.attrs,cleanObj({'tvg-name':c.name,'tvg-logo':e.info?.movie_image||s.cover,'group-title':g}));
        c.meta=cleanObj({kind:'serie',show:s.name,season:+sn||'',episode:+en||'',title:e.title&&e.title!==c.name?e.title:'',year:(s.releaseDate||s.release_date||'').slice(0,4),rating:s.rating&&+s.rating?(+s.rating).toFixed(1):''});r.push(c)}
      return r};
    await Promise.all(Array.from({length:Math.min(6,list.length)},async()=>{while(next<list.length){const k=next++;res[k]=await one(list[k])}}));
    for(const r of res)out.push(...(r||[]));if(fails)toast(`${fmt(fails)} série${fails>1?'s':''} n’ont pas répondu et ont été ignorées.`,'err')}
  return{chans:out,epg:`${h}/xmltv.php?username=${eu}&password=${ep}`};
}

function toolXtream(){

<div class="three"><div class="fld"><label for="nh">Nouveau serveur</label><input class="in mono" id="nh" placeholder="inchangé" spellcheck="false"></div><div class="fld"><label for="nu">Nouvel identifiant</label><input class="in mono" id="nu" placeholder="inchangé" autocomplete="off"></div><div class="fld"><label for="np">Nouveau mot de passe</label><input class="in mono" id="np" placeholder="inchangé" autocomplete="off"></div></div>
<div class="fld"><label>Extension des flux en direct</label><div class="seg"><label><input type="radio" name="next" value="" checked><span>Inchangée</span></label><label><input type="radio" name="next" value=".ts"><span>.ts</span></label><label><input type="radio" name="next" value=".m3u8"><span>.m3u8</span></label><label><input type="radio" name="next" value="none"><span>Aucune</span></label></div></div>
<div><button class="btn pri" id="xswap">Mettre à jour les URL</button></div>`:'<p class="note" style="margin:0">Aucune URL au format Xtream Codes (serveur/identifiant/mot de passe/numéro) dans cette playlist. Utilisez l’onglet « Générer l’adresse » pour en charger une.</p>';
    const b=$('#xswap',p);if(b)b.onclick=()=>{const i=+$('input[name=xacc]:checked',p).value;const[h,u,pw]=rows[i][0].split('\n');const nh=$('#nh',p).value.trim().replace(/\/+$/,'')||h,nu=$('#nu',p).value.trim()?encodeURIComponent($('#nu',p).value.trim()):u,np=$('#np',p).value.trim()?encodeURIComponent($('#np',p).value.trim()):pw,ext=$('input[name=next]:checked',p).value;let n=0;
      mutate(()=>{for(const c of S.chans){const m=c.url.match(XRE);if(!m||m[1]!==h||m[3]!==u||m[4]!==pw)continue;let e=m[6]||'';if(ext&&(!m[2]||m[2]==='live'))e=ext==='none'?'':ext;
        c.url=`${nh}/${m[2]?m[2]+'/':''}${nu}/${np}/${m[5]}${e}${m[7]||''}`;n++}
        for(const k of ['url-tvg','x-tvg-url']){const v=S.header[k];if(v&&v.includes(h))S.header[k]=v.split(h).join(nh).replace('username='+u,'username='+nu).replace('password='+pw,'password='+np)}});
      toast(`${fmt(n)} URL mises à jour`);closeModal()};
  };
  $('#xtt',sh).onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.t)};show(rows.length?'swap':'build');

  for(const c of S.chans){by[ctype(c)]++;if(!c.attrs['tvg-logo'])nl++;if(!c.attrs['tvg-id'])ni++;if(!grp(c))ng++;if(c.off||S.hidden.has(grp(c)))off++;if(!validUrl(c.url))bad++;
    try{const u=new URL(c.url);hosts.set(u.host,(hosts.get(u.host)||0)+1);proto.set(u.protocol.replace(':',''),(proto.get(u.protocol.replace(':',''))||0)+1)}catch{}}
  const d=dupSets();const du=[...d.u.values()].reduce((s,v)=>s+(v>1?v-1:0),0);
  const top=[...S.counts].sort((a,b)=>b[1]-a[1]).slice(0,12),mx=top[0]?.[1]||1;
  const stat=(l,v,f)=>`<div class="stat"><small>${l}</small><b>${fmt(v)}</b>${f?`<div><button class="btn sm ghost" data-sf="${f}" style="padding:0;height:auto;color:var(--accent)">Afficher</button></div>`:''}</div>`;
  const sh=openModal('Statistiques',`<div class="stats">${stat('Chaînes',n)}${stat('Groupes',S.order.length)}${stat('Direct',by.live)}${stat('Films',by.film)}${stat('Séries',by.serie)}${stat('Radio',by.radio)}</div>
<div class="fs"><h4>À corriger</h4><div class="stats">${stat('Sans logo',nl,nl&&'nologo')}${stat('Sans tvg-id',ni,ni&&'noid')}${stat('Sans groupe',ng,ng&&'nogroup')}${stat('URL invalides',bad,bad&&'badurl')}${stat('URL en double',du,du&&'dupurl')}${stat('Exclues de l’export',off,off&&'off')}</div></div>
<div class="fs"><h4>Groupes les plus fournis</h4><div style="display:grid;gap:6px">${top.map(([g,v])=>`<div class="bar"><span title="${esc(gLabel(g))}">${esc(gLabel(g))}</span><i style="width:${Math.max(2,v/mx*100)}%"></i><span>${fmt(v)}</span></div>`).join('')}</div></div>
<div class="two"><div class="fs"><h4>Serveurs</h4><table class="tbl">${[...hosts].sort((a,b)=>b[1]-a[1]).slice(0,8).map(([h,v])=>`<tr><td class="mono">${esc(h)}</td><td class="n">${fmt(v)}</td></tr>`).join('')||'<tr><td class="note">Aucun</td></tr>'}</table></div>
<div class="fs"><h4>Protocoles</h4><table class="tbl">${[...proto].sort((a,b)=>b[1]-a[1]).map(([h,v])=>`<tr><td class="mono">${esc(h)}</td><td class="n">${fmt(v)}</td></tr>`).join('')||'<tr><td class="note">Aucun</td></tr>'}</table></div></div>`,{wide:true});
  sh.addEventListener('click',e=>{const b=e.target.closest('[data-sf]');if(!b)return;S.f.state=b.dataset.sf;$('#fs').value=S.f.state;S.f.g='*';closeModal();refresh(false);list.scrollTop=0;renderList()});
}

/* ============ Lecteur ============ */
let hlsLib=null,hls=null;
function loadHls(){if(window.Hls)return Promise.resolve(window.Hls);if(hlsLib)return hlsLib;
  hlsLib=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js';s.onload=()=>res(window.Hls);s.onerror=()=>{hlsLib=null;rej(new Error('hls.js indisponible'))};document.head.append(s)});return hlsLib}
function openPlayer(c){
  if(!c)return;const u=c.url||'';
  const sh=openModal(c.name||'Lecture',`<video id="vid" controls playsinline></video><div class="fld"><label>Flux</label><div class="inrow"><input class="in mono" value="${esc(u)}" readonly><button class="ib" id="pcp" title="Copier l’URL">${ICON.copy}</button></div></div><p class="note" id="pmsg">Connexion au flux…</p>`,{wide:true});
  const v=$('#vid',sh),msg=$('#pmsg',sh);$('#pcp',sh).onclick=()=>copyText(u,'URL');
  sh.parentElement._onclose=()=>{try{hls?.destroy()}catch{}hls=null;v.pause();v.removeAttribute('src');v.load()};
  const fail=why=>{msg.className='note warn';msg.textContent=why};
  if(location.protocol==='https:'&&/^http:/i.test(u)){fail('Ce flux est en http alors que l’atelier est en https : le navigateur refuse de le lire. Copiez l’URL et ouvrez-la dans VLC, TiviMate ou Kodi.');return}
  if(!/^https?:/i.test(u)){fail('Ce protocole ne se lit pas dans un navigateur. Copiez l’URL et ouvrez-la dans VLC ou Kodi.');return}
  const ok=()=>{msg.className='note';msg.textContent='Lecture en cours. Si l’image n’apparaît pas, le serveur limite sans doute l’accès aux navigateurs.'};
  v.addEventListener('playing',ok);v.addEventListener('error',()=>fail('Lecture impossible : le format n’est pas pris en charge par le navigateur (MPEG-TS, MKV…) ou le serveur refuse la connexion. '+(inClaude()?'Dans Claude, les flux externes sont bloqués : utilisez la version autonome ou un lecteur IPTV.':'Essayez VLC ou un lecteur IPTV.')));
  if(/\.m3u8(\?|$)/i.test(u)&&!v.canPlayType('application/vnd.apple.mpegurl')){
    loadHls().then(H=>{if(!H.isSupported()){fail('Ce navigateur ne sait pas lire le HLS.');return}hls=new H();hls.on(H.Events.ERROR,(e,d)=>{if(d.fatal)fail('Le flux HLS ne répond pas ('+d.details+'). Vérifiez l’URL ou les droits d’accès.')});hls.loadSource(u);hls.attachMedia(v);v.play().catch(()=>{})}).catch(()=>fail('Le lecteur HLS n’a pas pu être chargé.'));
  }else{v.src=u;v.play().catch(()=>{})}
}
